<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diario de Estudio</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="contenedor">

    <header class="cabecera">
      <h1>Diario de Estudio</h1>
      <p class="subtitulo">Registra tus sesiones y mantén tu racha 🔥</p>
    </header>

    <section class="tarjeta-racha">
      <div class="racha-bloque">
        <span class="fuego">🔥</span>
        <div class="racha-info">
          <span id="racha" class="racha-numero">0</span>
          <span class="racha-texto" id="racha-texto">días seguidos</span>
          <span class="racha-titulo">Racha actual</span>
        </div>
      </div>
      <div class="racha-bloque">
        <span class="fuego">⭐</span>
        <div class="racha-info">
          <span id="mejor-racha" class="racha-numero">0</span>
          <span class="racha-texto" id="mejor-racha-texto">días seguidos</span>
          <span class="racha-titulo">Mejor racha</span>
        </div>
      </div>
    </section>

    <section class="tarjeta">
      <h2>Nueva sesión</h2>
      <form id="formulario">
        <div class="campo">
          <label for="fecha">Fecha</label>
          <input type="date" id="fecha" required>
        </div>
        <div class="campo">
          <label for="tema">Tema</label>
          <input type="text" id="tema" placeholder="¿Qué has estudiado?" required>
        </div>
        <div class="campo">
          <label for="minutos">Minutos</label>
          <input type="number" id="minutos" min="1" step="1" placeholder="Ej: 30" required>
        </div>
        <button type="submit" class="boton">Guardar sesión</button>
      </form>
    </section>

    <section class="tarjeta">
      <h2>Mis sesiones</h2>
      <ul id="lista-sesiones" class="lista"></ul>
      <p id="mensaje-vacio" class="mensaje-vacio">Aún no hay sesiones registradas. ¡Empieza hoy!</p>
    </section>

  </main>
  <script src="app.js"></script>
</body>
</html>
